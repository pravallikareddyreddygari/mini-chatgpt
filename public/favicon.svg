<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#10a37f" rx="20"/>
  
  <!-- ChatGPT hexagonal logo shape -->
  <g transform="translate(50, 50)">
    <!-- Outer hexagon path -->
    <path d="M 0,-28 L 24,-14 L 24,14 L 0,28 L -24,14 L -24,-14 Z" 
          fill="none" 
          stroke="#fff" 
          stroke-width="4"
          stroke-linejoin="round"/>
    
    <!-- Inner connecting lines -->
    <line x1="0" y1="-28" x2="0" y2="-10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="-14" x2="10" y2="-5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="14" x2="10" y2="5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="0" y2="10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="14" x2="-10" y2="5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="-14" x2="-10" y2="-5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="#fff"/>
  </g>
</svg>